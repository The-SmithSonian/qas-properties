<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <!-- Keeps the admin login page out of search results -->
    <meta name="robots" content="noindex, nofollow">

    <title>QAS Properties - Admin Login</title>

    <link rel="stylesheet" href="admin.css">

</head>

<body>

    <main class="login-container">

        <div class="login-box">

            <h1>QAS Properties Ltd</h1>

            <h2>Admin Login</h2>

            <p>
                Authorized personnel only.
            </p>


            <form id="loginForm">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="username"
                    autocapitalize="off"
                    spellcheck="false"
                    autofocus
                    required
                >


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter password"
                    autocomplete="current-password"
                    required
                >


                <button type="submit">
                    Login
                </button>

                <!-- Screen readers announce messages placed here -->
                <p
                    id="loginMessage"
                    role="alert"
                    aria-live="polite"
                ></p>

            </form>

        </div>

    </main>


    <!-- Supabase must load before admin.js -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="admin.js"></script>

</body>

</html>
